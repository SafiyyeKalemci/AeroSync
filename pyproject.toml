[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosync-integrated"
version = "0.1.0"
description = "Safe integration backend for AeroSync competition tasks"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "requests>=2.31,<3.0",
  "python-decouple>=3.8,<4.0",
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.9,<5.0",
  "ultralytics>=8.3,<9.0",
]

[project.optional-dependencies]
matching = [
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "yacs>=0.1.8,<1.0",
  "kornia>=0.7,<1.0",
  "einops>=0.7,<1.0",
  "loguru>=0.7,<1.0",
]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "competition*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "online: requires an explicitly authorized real network connection",
]
